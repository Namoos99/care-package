<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A tiny room full of things that remind you of someone. Make one and send it as a link.">
<meta name="theme-color" content="#9ccdbb">
<title>Care Package Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Instrument+Sans:wght@400;600&family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: the live room is the hero; a cream sticker-panel of controls sits beside it and stacks below on phones.
   Palette pulled from the room: mint wall, olive, curtain pink, cabinet orange, wood brown. One deliberate look, no dark variant. */
:root{
  --wall:#9ccdbb; --olive:#5d6a26; --pink:#ec6a9c; --orange:#e5732b; --wood:#7a4524;
  --cream:#fbf1dc; --ink:#2b1d16; --muted:#6b4a37; --sun:#f6c445;
  --f-display:'Shrikhand','Cooper Black',Georgia,serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Gaegu','Comic Sans MS',ui-rounded,cursive;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--wall);margin:0}
body{background-image:radial-gradient(rgba(43,29,22,.3) 1.4px,transparent 1.6px);background-size:46px 46px;background-position:12px 20px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1260px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
.top{display:flex;align-items:baseline;gap:4px 16px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-family:var(--f-display);font-size:clamp(30px,4.6vw,46px);line-height:1;margin:0;color:var(--pink);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.tagline{margin:0;font-weight:600}
.studio{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:920px){.studio{grid-template-columns:minmax(0,1fr)}}
body.viewing .studio{grid-template-columns:minmax(0,1fr);max-width:1020px;margin:0 auto}
body.viewing .top{justify-content:center}

/* scene */
.frame{position:relative;border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:7px 7px 0 var(--ink);background:var(--olive);max-width:100%}
#scene{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:manipulation;transition:filter .9s ease}
#scene:focus{outline:none}
#scene:focus-visible{outline:4px solid var(--sun);outline-offset:-4px}
.sealed #scene{filter:blur(14px) saturate(1.15) brightness(.82)}
.sw{transform-box:view-box}
.sw-lamp{transform-origin:553px 0px;animation:swing 5.5s ease-in-out infinite}
.sw-curL{transform-origin:662px 0px;animation:swing2 6.5s ease-in-out infinite}
.sw-curR{transform-origin:1046px 0px;animation:swing2 7s ease-in-out -2s infinite}
.sw-mon{transform-origin:505px 452px;animation:sway 7s ease-in-out infinite}
.sw-poth{transform-origin:945px 300px;animation:sway2 6s ease-in-out -1s infinite}
.sw-flow{transform-origin:815px 300px;animation:sway2 4.6s ease-in-out infinite}
.sw-cat{transform-origin:166px 553px;animation:breathe 3.4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
@keyframes swing2{0%,100%{transform:rotate(-.45deg)}50%{transform:rotate(.45deg)}}
@keyframes sway{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
@keyframes sway2{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.035)}}
.steam path{fill:none;stroke:#fffaf0;stroke-width:6;stroke-linecap:round;opacity:0;animation:steam 3.6s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1.2s}.steam path:nth-child(3){animation-delay:2.4s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}35%{opacity:.75}100%{opacity:0;transform:translateY(-34px)}}
.zz text{font-family:var(--f-hand);font-weight:700;fill:var(--cream);stroke:var(--ink);stroke-width:4px;paint-order:stroke;opacity:0;animation:zz 4.2s ease-in-out infinite}
.zz text:nth-child(2){animation-delay:1.4s}.zz text:nth-child(3){animation-delay:2.8s}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(16px,-40px)}}
.star{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.1);opacity:1}}
.mote{animation:mote 9s ease-in-out infinite}
@keyframes mote{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(14px,-26px);opacity:.85}}
.note{opacity:0}
.playing .note{animation:noteup 2.6s ease-out infinite}
.playing .note:nth-child(2){animation-delay:.85s}.playing .note:nth-child(3){animation-delay:1.7s}
@keyframes noteup{0%{opacity:0;transform:translate(0,0) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-90px) rotate(18deg)}}
#spin{display:none}.playing #spin{display:inline}
#night{transition:opacity 1.2s ease}#glow{transition:opacity 1.2s ease}#starsG{transition:opacity 1.2s ease}
.spot{cursor:pointer}
.spot .hit{fill:transparent;stroke:transparent;stroke-width:4;stroke-dasharray:12 9;transition:stroke .2s,fill .2s}
.spot:hover .hit,.spot.focus .hit{stroke:var(--cream);fill:rgba(255,248,230,.13)}
.spot.focus .hit{stroke:var(--pink)}
.spot .lab{opacity:0;transition:opacity .15s;pointer-events:none}
.spot:hover .lab{opacity:1}
.lab rect{fill:var(--cream);stroke:var(--ink);stroke-width:3}
.lab text{font-family:var(--f-body);font-weight:600;font-size:20px;fill:var(--ink)}
.spark{transform-box:fill-box;transform-origin:center;animation:tw 1.9s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.6) rotate(0)}50%{transform:scale(1.1) rotate(22deg)}}
.near .spark{animation-duration:.7s}
#av{cursor:pointer}
.bubble rect,.bubble path{fill:#fffaf0;stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}
.bubble text{font-family:var(--f-hand);font-weight:700;font-size:30px;fill:var(--ink)}
.heart{animation:rise 1.5s ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-150px) scale(1.1);opacity:0}}
.ctrls{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;z-index:4}
.cbtn{font:600 13px/1 var(--f-body);display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:2.5px solid var(--ink);border-radius:999px;background:var(--cream);color:var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.cbtn[aria-pressed="true"]{background:var(--sun)}
.cbtn svg{width:15px;height:15px}
.songcard{position:absolute;right:12px;bottom:12px;z-index:4;width:min(340px,calc(100% - 24px));box-sizing:border-box;background:var(--cream);border:2.5px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:8px 10px 10px;display:grid;gap:8px;justify-items:start;animation:pop .3s cubic-bezier(.3,1.6,.5,1) both}
.songcard iframe{width:100%;border:0;border-radius:12px;display:block}
.songhead{display:flex;justify-content:space-between;align-items:center;width:100%;font-family:var(--f-display);font-size:16px}
.x.sx{position:static;width:28px;height:28px;font-size:16px}
@media (max-width:560px){.songcard{top:8px;bottom:auto;right:8px}}
.hint{margin:12px 2px 0;font-weight:600;font-size:14px}
@media (hover:none){.kbd{display:none}}

/* panel */
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:20px;box-shadow:7px 7px 0 var(--ink);overflow:hidden;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:3px solid var(--ink)}
.tabs button{font-family:var(--f-display);font-size:17px;padding:10px 2px 8px;background:transparent;border:0;border-right:2.5px solid var(--ink);cursor:pointer;color:var(--ink)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--sun)}
.pane{padding:18px;display:grid;gap:16px}
.field{display:grid;gap:8px;min-width:0}
.lbl{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.sw-b{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--ink);cursor:pointer;padding:0}
.sw-b[aria-pressed="true"]{box-shadow:0 0 0 3px var(--cream),0 0 0 5.5px var(--ink)}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--ink);background:#fff;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.chip small{opacity:.6;font-size:11px}
.things{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:8px}
.things .chip{justify-content:flex-start;border-radius:12px;padding:7px 10px}
.things .chip[aria-pressed="true"]{background:var(--pink);color:#fff}
.things .chip[aria-current="true"]{outline:3px dashed var(--orange);outline-offset:2px}
input[type=text],textarea{font:inherit;width:100%;box-sizing:border-box;padding:10px 12px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
textarea{font-family:var(--f-hand);font-size:21px;line-height:1.3;min-height:116px;resize:vertical}
.editor{border:2.5px dashed var(--ink);border-radius:14px;padding:14px;display:grid;gap:10px;background:#fff}
.editor h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15;color:var(--orange)}
.edfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ex{display:inline-block;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--sun);border:2px solid var(--ink);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:4px}
.btn{font-family:var(--f-display);font-size:18px;padding:9px 18px 7px;border:3px solid var(--ink);border-radius:14px;background:var(--orange);color:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}.btn.pink{background:var(--pink)}
.btn.small{font-size:15px;padding:6px 12px 4px;border-width:2.5px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.linkbox{display:grid;gap:8px}
.linkbox textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:80px;word-break:break-all}
.small{font-size:13px;color:var(--muted);margin:0}

/* recipient */
.greet{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,8vw,84px);line-height:1.05;text-align:center;margin:0;color:var(--pink);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);text-wrap:balance;overflow-wrap:anywhere}
.sub{text-align:center;font-weight:600;font-size:17px;margin:10px auto 20px;max-width:56ch;text-wrap:balance}
.envelope{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:5}
.env-card{background:var(--cream);border:3px solid var(--ink);border-radius:18px;box-shadow:7px 7px 0 var(--ink);padding:22px 26px 24px;text-align:center;max-width:380px;display:grid;gap:10px;justify-items:center;transform:rotate(-1.5deg);transition:transform .5s ease,opacity .5s ease}
.env-card .stamp{width:78px;height:78px}
.env-card h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4.6vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.env-card p{margin:0;font-weight:600;color:var(--muted)}
.opening .env-card{transform:translateY(30px) scale(.9) rotate(4deg);opacity:0}
@media (max-width:560px){.env-card{padding:12px 14px 14px;gap:6px}.env-card .stamp{width:44px;height:44px}.env-card h1{font-size:20px}.env-card p{font-size:13px}.env-card .btn{font-size:15px;padding:6px 14px 4px}.ctrls{left:8px;bottom:8px}.cbtn{padding:5px 8px;font-size:12px}}
.found{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px;align-items:center}
.found b{font-family:var(--f-display);font-weight:400;font-size:20px}
.pip{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);background:var(--cream)}
.pip.on{background:var(--pink)}
.vfoot{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}

/* note card */
.scrim{position:fixed;inset:0;background:rgba(43,29,22,.5);display:grid;place-items:center;padding:16px;z-index:20}
.card{position:relative;width:min(440px,100%);box-sizing:border-box;background-color:var(--cream);background-image:repeating-linear-gradient(transparent 0 33px,#efc6c9 33px 35px);border:3px solid var(--ink);border-radius:16px;box-shadow:7px 7px 0 var(--ink);padding:22px 24px 20px;transform:rotate(-1.4deg);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.85) rotate(-4deg);opacity:0}to{transform:rotate(-1.4deg);opacity:1}}
.ntag{display:inline-block;font-family:var(--f-display);font-size:17px;background:var(--sun);border:2.5px solid var(--ink);border-radius:8px;padding:2px 10px 0}
.ntext{font-family:var(--f-hand);font-size:27px;line-height:35px;margin:12px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.nfrom{font-family:var(--f-hand);font-size:24px;text-align:right;color:var(--muted)}
.x{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.sw,.steam path,.zz text,.star,.mote,.note,.spark{animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <p class="logo">care package</p>
    <p class="tagline" id="tagline">a tiny room full of things that remind you of someone</p>
  </header>
  <h1 class="greet" id="vgreet" dir="auto" hidden></h1>
  <p class="sub" id="vsub" hidden></p>
  <div class="studio">
    <section>
      <div class="frame" id="frame">
        <svg id="scene" viewBox="0 0 1280 960" tabindex="0" role="application" aria-label="Your room. Tap the floor to walk, tap things to open them. Arrow keys walk, space opens what's nearby."></svg>
        <div class="ctrls" id="ctrls">
          <button class="cbtn" id="musicBtn" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 12.5V3.2l8-1.7v9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="4.2" cy="12.6" r="2.2" fill="currentColor"/><circle cx="12.2" cy="10.6" r="2.2" fill="currentColor"/></svg>music</button>
          <button class="cbtn" id="lightBtn" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.5 10.6A5.6 5.6 0 0 1 5.4 2.2a5.6 5.6 0 1 0 6.1 8.4Z" fill="currentColor"/></svg>night</button>
        </div>
        <div class="songcard" id="songcard" hidden></div>
        <div class="envelope" id="env" hidden></div>
      </div>
      <p class="hint" id="hint">Tap the floor to walk around. Tap anything to hide a note in it.<span class="kbd"> On a keyboard, click the room, then use the arrow keys and space.</span></p>
      <div class="found" id="found" hidden></div>
      <div class="vfoot" id="vfoot" hidden></div>
    </section>
    <aside class="panel" id="panel">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="pane" class="pane"></div>
    </aside>
  </div>
</div>

<div id="scrim" class="scrim" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ntag">
    <button class="x" id="nclose" aria-label="Close note">×</button>
    <span class="ntag" id="ntag"></span>
    <p class="ntext" id="ntext" dir="auto"></p>
    <div class="nfrom" id="nfrom"></div>
  </div>
</div>

 const headTop=P.y-208*s, bw=Math.min(1260,bubbleW),bh=bubbleH;let cx=Math.max(bw/2+8,Math.min(1272-bw/2,P.x+(P.x<640?95:-95)));const by=Math.max(6,headTop-24-bh);
 const r=$('#bRect');r.setAttribute('x',(cx-bw/2).toFixed(1));r.setAttribute('y',by.toFixed(1));r.setAttribute('width',bw.toFixed(1));r.setAttribute('height',bh);

 const tx=Math.max(cx-bw/2+20,Math.min(cx+bw/2-20,P.x));$('#bTail').setAttribute('d',`M${tx-12} ${by+bh-2}L${P.x} ${headTop-6}L${tx+12} ${by+bh-2}Z`);

function hearts(x,y,n=7){const fx=$('#fx');const cols=['#ec6a9c','#e5732b','#f6c445','#ff8fb0'];for(let i=0;i<n;i++){const g=document.createElementNS('http://www.w3.org/2000/svg','path');const hx=x+(Math.random()-.5)*50,hy=y+(Math.random()-.5)*20,k=1+Math.random()*.6;g.setAttribute('d',`M${hx} ${hy+9*k}l-${10*k} -${10*k}a${6*k} ${6*k} 0 0 1 ${10*k} -${7*k}a${6*k} ${6*k} 0 0 1 ${10*k} ${7*k}z`);g.setAttribute('fill',cols[i%4]);g.setAttribute('stroke',INK);g.setAttribute('stroke-width','2.5');g.setAttribute('class','heart');g.style.setProperty('--dx',((Math.random()-.5)*120).toFixed(0)+'px');g.style.animationDelay=(i*.07)+'s';fx.appendChild(g);setTimeout(()=>g.remove(),1800)}}

let actx=null,master=null,musicOn=false,timer=null,step=0,crackle=null;
const CHORDS=[[174.61,220,261.63,329.63],[164.81,196,246.94,293.66],[146.83,174.61,220,261.63],[130.81,164.81,196,246.94]];
const MEL=[523.25,587.33,659.25,783.99,880,659.25,587.33,523.25];
function tone(f,t0,dur,type,vol){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+Math.min(.25,dur*.3));g.gain.exponentialRampToValueAtTime(.0005,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05)}
function tick(){const t0=actx.currentTime+.05,beat=60/70;if(step%8===0){const ch=CHORDS[(step/8|0)%4];ch.forEach(f=>tone(f,t0,beat*8,'sine',.05));tone(ch[0]/2,t0,beat*4,'triangle',.07)}if(step%2===0||Math.random()<.3){if(Math.random()<.62)tone(MEL[(Math.random()*MEL.length)|0],t0,beat*1.3,'triangle',.05)}step++}
function setMusic(v){
 musicOn=v;$('#rec').classList.toggle('playing',v);$('#musicBtn').setAttribute('aria-pressed',v);
 if(cur()&&cur().sp){showSong(v);if(actx){clearInterval(timer);try{master.gain.setTargetAtTime(0,actx.currentTime,.2)}catch(e){}}return}
 showSong(false);
 try{
  if(v){if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1700;master.connect(lp);lp.connect(actx.destination)}
   actx.resume();master.gain.cancelScheduledValues(actx.currentTime);master.gain.setTargetAtTime(.9,actx.currentTime,.3);
   if(!crackle){const len=actx.sampleRate*2,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()<.0009?(Math.random()*2-1)*.6:(Math.random()*2-1)*.012;crackle=actx.createBufferSource();crackle.buffer=buf;crackle.loop=true;crackle.connect(master);crackle.start()}
   clearInterval(timer);step=0;tick();timer=setInterval(tick,60/70/2*1000)}
  else if(actx){clearInterval(timer);master.gain.setTargetAtTime(0,actx.currentTime,.25)}
 }catch(e){}
}

 $('#frame').classList.add('sealed');const env=$('#env');env.hidden=false;env.classList.remove('opening');
 env.innerHTML=`<div class="env-card">${STAMP}<h1>${esc(vst.to||'Hey you')}, a care package came for you</h1><p>from ${esc(vst.from||'someone who misses you')}</p><button class="btn pink" id="openBtn">Open it</button></div>`;
 $('#vgreet').textContent=vst.g||'i miss you';$('#vsub').innerHTML=`${esc(vst.from||'Someone')} hid little notes around this room for ${esc(vst.to||'you')}. Tap a sparkle and they’ll walk you to it, or tap the floor to wander.<span class="kbd"> Arrow keys work too.</span>`;
 $('#vfoot').innerHTML=isPreview?'<button class="btn alt" id="backEdit">Back to editing</button>':'<a class="btn alt" href="#" id="makeOwn">Make one for someone</a>';
 $('#vfoot').hidden=false;window.scrollTo(0,0);
}
function updateFound(){const ids=ITEM_ORDER.filter(id=>id in vst.n);$('#found').innerHTML=`<b>${seen.size} of ${ids.length} found</b>${ids.map(id=>`<span class="pip ${seen.has(id)?'on':''}" title="${esc(lab(id))}"></span>`).join('')}`}
document.addEventListener('click',e=>{
 const b=e.target.closest('#openBtn,#backEdit,#makeOwn');if(!b)return;
 if(b.id==='openBtn'){b.disabled=true;const env=$('#env');env.classList.add('opening');
  setTimeout(()=>{env.hidden=true;$('#frame').classList.remove('sealed');$('#vgreet').hidden=false;$('#vsub').hidden=false;$('#found').hidden=false;updateFound();
   const n=Object.keys(vst.n).length;P.wave=1.6;hearts(P.x,P.y-210*scaleAt(P.y),9);say(`hi ${vst.to||'you'}! I hid ${n} note${n===1?'':'s'} in here`,4200);$('#scene').focus({preventScroll:true})},reduce()?0:450);return}
 if(b.id==='backEdit'){closeNote();startCreate();return}
 if(b.id==='makeOwn'){e.preventDefault();try{history.replaceState(null,'',location.pathname)}catch(_){}st=loadDraft()||clone(DEFAULT);closeNote();startCreate()}
});
function openNote(id){
 const first=!seen.has(id);seen.add(id);renderSpots();updateFound();
 $('#ntag').textContent=lab(id);
 $('#ntext').textContent=vst.n[id]||'(no words on this one. it just felt like it belonged here.)';
 $('#nfrom').textContent='— '+(vst.from||'me');$('#scrim').hidden=false;$('#nclose').focus();
 const total=Object.keys(vst.n).length;
 if(first&&seen.size===total)setTimeout(()=>{hearts(P.x,P.y-210*scaleAt(P.y),12);P.wave=2;say(`you found them all. ${vst.g||'i miss you'}`,5200)},600);
}
function closeNote(){$('#scrim').hidden=true;if(mode==='view')$('#scene').focus({preventScroll:true})}
$('#nclose').addEventListener('click',closeNote);
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeNote()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)closeNote()});

/* ---------- boot ---------- */
window.addEventListener('hashchange',async()=>{const h=location.hash.slice(1);if(h.startsWith('cp')){try{closeNote();startView(sanitize(await decodePkg(h)),false)}catch(e){}}});
buildScene();requestAnimationFrame(frame);
(async function(){
 const h=location.hash.slice(1);
 if(h.startsWith('cp')){try{startView(sanitize(await decodePkg(h)),false);return}catch(e){startCreate();$('#pane').insertAdjacentHTML('afterbegin','<p class="small" style="color:#b0281a;font-weight:600">That link looks cut off, so the package couldn’t open. Ask for the whole link again.</p>');return}}
 startCreate();
})();
</script>
